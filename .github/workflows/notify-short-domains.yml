name: Notify Short Domains

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Ensure issue label exists
        run: gh label create domain-alert --color FF6B6B --description "Available short domain alert" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify short domains
        run: node src/cli/notify-short-domains.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ASSIGNEE: ${{ github.repository_owner }}
