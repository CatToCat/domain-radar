# Domain Radar v4 configuration.
#
# Strategy: enumerate short SLDs under short TLDs that Cloudflare Registrar
# supports, then confirm availability via Cloudflare's domain-check API.
# Goal: find cheap, registerable short domains.

sld:
  maxLength: 2    # enumerate SLDs from 1 to this many characters
  mode: mixed     # digits | alpha | mixed (mixed = a-z 0-9, 36 chars)

tld:
  maxLength: 2    # include TLDs with 1 to this many characters from the supported list

scanner:
  dnsConcurrency: 50          # parallel DNS pre-filter lookups
  cloudflareConcurrency: 3    # parallel Cloudflare domain-check batches
  cloudflareBatchSize: 20     # domains per domain-check request (CF max is 20)
  cloudflareDelay: 200        # delay between Cloudflare batches (ms)
  shardsPerRun: 0             # 0 = run all shards in a single pass
